<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reste à vivre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column. The month's remaining budget comes first, then colour-coded categories; five tabs at the bottom, settings behind the gear. */
:root{
  --bg:#EFF3F1; --surface:#FFFFFF; --ink:#12241F; --muted:#586964; --line:#D6E0DB;
  --accent:#0E6B58; --accent-ink:#FFFFFF; --accent-soft:#DCEFE8;
  --warn:#9A5B00; --warn-ink:#FFFFFF; --warn-soft:#FAEBD2;
  --bad:#B3261E; --bad-ink:#FFFFFF; --bad-soft:#F9DEDC;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#6250d6; --c8:#e34948;
  --cfix:#8A9893;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1614; --surface:#15221F; --ink:#E5EFEB; --muted:#9BB0A9; --line:#263A36;
    --accent:#4FD1AE; --accent-ink:#06231C; --accent-soft:#1B3A33;
    --warn:#F0B35A; --warn-ink:#2A1A00; --warn-soft:#3A2D14;
    --bad:#F2918A; --bad-ink:#2E0B08; --bad-soft:#40201E;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
    --cfix:#6F837D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#15221F; --ink:#E5EFEB; --muted:#9BB0A9; --line:#263A36;
  --accent:#4FD1AE; --accent-ink:#06231C; --accent-soft:#1B3A33;
  --warn:#F0B35A; --warn-ink:#2A1A00; --warn-soft:#3A2D14;
  --bad:#F2918A; --bad-ink:#2E0B08; --bad-soft:#40201E;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  --cfix:#6F837D; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:18px 120px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.top h1{font:700 22px/1.1 var(--display);margin:0;letter-spacing:-.01em}
.top .tr{display:flex;align-items:center;gap:8px;min-width:0}
.top span{color:var(--muted);font-size:14px;text-transform:capitalize;white-space:nowrap}
.gear{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.gear svg,.gear-ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:0}
h2{font:700 19px/1.2 var(--display);margin:0;letter-spacing:-.005em}
h3{font:600 16px/1.3 var(--body);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

.hero{border-radius:20px;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.hero.good{background:var(--accent);color:var(--accent-ink);--hero-ring:var(--accent)}
.hero.warn{background:var(--warn);color:var(--warn-ink);--hero-ring:var(--warn)}
.hero.bad{background:var(--bad);color:var(--bad-ink);--hero-ring:var(--bad)}
.hero .big{font:700 clamp(56px,18vw,88px)/.95 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero .sub{font-size:15px;opacity:.94}
.hero .btn{align-self:flex-start;background:transparent;color:inherit;border-color:currentColor}
.track{position:relative;height:10px;border-radius:99px;background:color-mix(in srgb,currentColor 25%,transparent);margin-top:6px}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:currentColor}
.track .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:currentColor;border-radius:2px;box-shadow:0 0 0 2px var(--hero-ring,transparent)}
.hero .legend{display:flex;justify-content:space-between;gap:12px;font-size:13px;opacity:.94;flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.note{border-radius:12px;padding:12px 14px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px;font-size:14px}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}

.btn{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input[type=number],input[type=text],select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--bg);color:var(--ink);min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 120px;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
details>summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:20px;color:var(--muted);line-height:1}
details[open]>summary::after{content:"–"}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{flex:1;appearance:none;border:0;background:none;border-radius:9px;padding:8px;font-weight:600;cursor:pointer;color:var(--muted);min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.dot{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.segbar{display:flex;gap:2px;height:20px}
.segbar i{display:block;min-width:3px}
.segbar i:first-child{border-radius:6px 2px 2px 6px}.segbar i:last-child{border-radius:2px 6px 6px 2px}.segbar i:only-child{border-radius:6px}
.crow{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;align-items:center}
.crow .bar,.brow .bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.crow .bar i,.brow .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.crow .bar i.warn,.brow .bar i.warn{background:var(--warn)}.crow .bar i.bad,.brow .bar i.bad{background:var(--bad)}
.clist{display:flex;flex-direction:column;gap:12px}
.brow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.brow input{width:92px;min-height:36px;padding:4px 8px;text-align:right}
.tx{display:flex;flex-direction:column}
.txr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.txr:first-child{border-top:0}
.txr .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:500}
.txr .a{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.txr .a.in{color:var(--accent)}
.txr .m{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.txr select{min-height:32px;padding:2px 8px;width:auto;font-size:13px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav strong{text-transform:capitalize;font-family:var(--display);font-size:18px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats div{display:flex;flex-direction:column;gap:2px;min-width:0}
.stats b{font:700 20px/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats span{font-size:12px;color:var(--muted)}
.chartbox{position:relative}
svg.chart{width:100%;height:auto;display:block;touch-action:pan-y}
svg.chart .grid{stroke:var(--line);stroke-width:1;fill:none}
svg.chart .tick{fill:var(--muted);font:11px var(--body)}
svg.chart .inv{stroke:var(--accent);stroke-width:2.5;fill:none;stroke-linejoin:round;stroke-linecap:round}
svg.chart .inv-area{fill:var(--accent-soft);stroke:none}
svg.chart .dep{stroke:var(--muted);stroke-width:2;stroke-dasharray:5 4;fill:none}
svg.chart .dot-inv{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .dot-dep{fill:var(--muted);stroke:var(--surface);stroke-width:2}
svg.chart .cross{stroke:var(--muted);stroke-width:1;opacity:.6}
svg.chart .seg-r{stroke:var(--surface);stroke-width:1.5}
svg.chart .pos{fill:var(--accent)}svg.chart .neg{fill:var(--bad)}
.tip{position:absolute;top:0;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;transform:translateX(-50%);z-index:2}
.tip .tl{display:flex;align-items:center;gap:6px;justify-content:space-between;gap:14px}
.key{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px}
.key span{display:inline-flex;align-items:center;gap:6px}
.sw{width:22px;height:0;border-top:3px solid var(--accent);display:inline-block}
.sw.d{border-top:2px dashed var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent);min-height:32px}
.rl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.rl b{font-variant-numeric:tabular-nums}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmp .bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.cmp .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.cmp .bar i.hi{background:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;font-size:12px;color:var(--muted);text-align:right;padding:4px 6px;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left;padding-left:0}
.tbl td{padding:8px 6px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{white-space:normal}
.tbl td .dot{margin-right:6px;vertical-align:-1px}
.up{color:var(--warn);font-weight:600}.down{color:var(--accent);font-weight:600}
.scroll{overflow-x:auto}
.step{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg)}
.step.done{background:var(--accent-soft);border-color:transparent}
.step .n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;flex:none}
.step summary{justify-content:flex-start}
.step summary::after{margin-left:auto}
.step .body{display:flex;flex-direction:column;gap:10px;padding-top:10px;font-size:15px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.qa{display:flex;gap:10px;flex-wrap:wrap}
.qa .btn{flex:1 1 120px}
.fb{border-radius:12px;padding:12px 14px;font-size:15px}
.fb.ok{background:var(--accent-soft)}.fb.ko{background:var(--warn-soft)}
.pbar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.idea,.reco{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.tag{align-self:flex-start;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--accent-soft);color:var(--ink)}
.tag.w{background:var(--warn-soft)}
.lever{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.lever:first-of-type{border-top:0;padding-top:0}
.arow{display:grid;grid-template-columns:auto 1fr 96px 110px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow input[type=number],.arow select{min-height:36px;padding:4px 8px}
.acc{display:grid;grid-template-columns:1fr 110px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.acc .nm{display:flex;flex-direction:column;min-width:0}
.acc input{min-height:36px;padding:4px 8px;text-align:right}
@media (max-width:480px){.arow{grid-template-columns:auto 1fr 90px;}.arow .mo{grid-column:2/3}.arow .rm{grid-column:3/4}.acc{grid-template-columns:1fr 100px}.acc .rm{grid-column:1/-1}}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{display:flex;width:100%;max-width:640px;gap:2px}
nav.tabs button{flex:1;min-width:0;appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--muted);font-size:11.5px;font-weight:600;cursor:pointer;min-height:52px}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;max-width:calc(100% - 32px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
body{margin:0}[hidden]{display:none!important}
</style>

<script>
(function(){
// <pure>
var SYS=[
 ['Impôts et taxes',['dgfip','impot','tresor public','taxe fonciere','taxe d habitation','taxe habitation']],
 ['Épargne',['livret','epargne','assurance vie','assurance-vie','pea ','per ']],
 ['Charges fixes',['loyer','edf','engie','totalenergies electricite','assurance','maif','macif','matmut','axa','orange','sfr','bouygues','free mobile','freebox','internet','mutuelle','veolia','pret ','credit immo','netflix','spotify','disney','canal','prime video','deezer','abonnement','navigo','cotisation','prlv','prelevement','frais','commission','agios','icloud']]
];
var DEFCATS=[
 {name:'Courses',slot:1,kw:['carrefour','leclerc','auchan','lidl','intermarche','monoprix','franprix','casino','picard','aldi','super u','hyper u','biocoop','grand frais','naturalia','supermarche','cora ']},
 {name:'Restaurants',slot:2,kw:['restaurant','mcdo','mcdonald','burger','uber eats','ubereats','deliveroo','just eat','boulangerie','brasserie','pizz','sushi','kebab','starbucks','cafe ','paul ','quick','kfc','subway']},
 {name:'Transport',slot:3,kw:['sncf','ratp','uber','bolt','total','esso','shell','station','peage','vinci','autoroute','parking','blablacar','tcl ','tisseo','essence','carburant','flixbus','ouigo','trainline','avia','bp ']},
 {name:'Loisirs',slot:4,kw:['cinema','ugc','pathe','steam','playstation','xbox','theatre','concert','ticketmaster','decathlon','basic fit','fitness','cultura','bowling','spectacle']},
 {name:'Shopping',slot:5,kw:['amazon','zara','h&m','hm ','kiabi','ikea','leroy merlin','castorama','zalando','cdiscount','vinted','apple','darty','boulanger','fnac','action ','primark']},
 {name:'Santé',slot:6,kw:['pharmacie','medecin','docteur','dentiste','hopital','doctolib','opticien','laboratoire','kine','osteo']},
 {name:'Autres',slot:7,kw:[]}
];
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();}
function labelKey(l){return norm(l).replace(/[^a-z ]/g,' ').split(/\s+/).filter(function(w){return w.length>2;}).slice(0,2).join(' ');}
function hit(n,kws){for(var i=0;i<kws.length;i++){if(kws[i]&&n.indexOf(' '+kws[i])>-1)return true;}return false;}
function categorize(label,amount,ctx){
  ctx=ctx||{};
  if(amount>0)return 'Revenu';
  var k=labelKey(label);if(ctx.rules&&k&&ctx.rules[k])return ctx.rules[k];
  var n=' '+norm(label)+' ',cats=ctx.cats||DEFCATS,i;
  for(i=0;i<cats.length;i++){if(cats[i].custom&&hit(n,cats[i].kw))return cats[i].name;}
  for(i=0;i<SYS.length;i++){if(hit(n,SYS[i][1]))return SYS[i][0];}
  for(i=0;i<cats.length;i++){if(!cats[i].custom&&hit(n,cats[i].kw))return cats[i].name;}
  return 'Autres';
}
function parseDelim(text,d){
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
    else if(ch==='"')q=true;
    else if(ch===d){row.push(cur);cur='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(function(x){return x.trim()!=='';}))rows.push(row);row=[];}
    else cur+=ch;
  }
  row.push(cur);if(row.some(function(x){return x.trim()!=='';}))rows.push(row);
  return rows;
}
function parseDate(s){
  s=String(s==null?'':s).trim();var m,y,mo,d;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/))){y=m[1];mo=m[2];d=m[3];}
  else if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))){y=m[3].length===2?'20'+m[3]:m[3];mo=m[2].padStart(2,'0');d=m[1].padStart(2,'0');}
  else if((m=s.match(/^(\d{4})(\d{2})(\d{2})/))){y=m[1];mo=m[2];d=m[3];}
  else return null;
  if(+mo<1||+mo>12||+d<1||+d>31||+y<1990)return null;
  return y+'-'+mo+'-'+d;
}
function parseAmt(s){
  if(s==null)return null;
  s=String(s).replace(/[\s  €]/g,'').replace(/EUR/gi,'');
  if(!s||s==='-'||s==='+')return null;
  if(s.indexOf(',')>-1&&s.indexOf('.')>-1){
    if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'');
  }else if(s.indexOf(',')>-1)s=s.replace(',','.');
  var v=parseFloat(s);return isNaN(v)?null:v;
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var head=text.split(/\r?\n/).slice(0,15).join('\n');
  var delim=head.indexOf(';')>-1?';':(head.indexOf('\t')>-1?'\t':',');

  var by=function(t){return sum(S.accounts.filter(function(a){return a.type===t;}).map(function(a){return a.amount;}));};
  var liquid=by('courant')+by('livretA')+by('ldds'),courant=by('courant'),months=liquid/spend;
  if(S.accounts.length){
    if(months<3)out.push({t:'Réserve de sécurité : '+months.toFixed(1).replace('.',',')+' mois',b:'Visez d’abord 3 mois de dépenses ('+eur(spend*3)+') sur des supports disponibles et sans impôt (Livret A, LDDS) avant de placer à long terme.',tag:'Priorité 1'});
    var idle=courant-spend*1.5;
    if(idle>=300){var roomA=ACC.livretA.cap-by('livretA'),roomL=ACC.ldds.cap-by('ldds');out.push({t:eur(Math.round(idle/10)*10)+' dorment sur le compte courant',b:'Un compte courant ne rapporte rien. Au-delà d’environ un mois et demi de dépenses, déplacez le surplus vers le Livret A (plafond restant : '+eur(Math.max(0,roomA))+') ou le LDDS (plafond restant : '+eur(Math.max(0,roomL))+'). Les intérêts sont exonérés d’impôt.',tag:'Gain sans risque'});}
  }
  if(R>0&&tmi>=0.30){var cap=perCap(R),ex=Math.min(1000,cap);out.push({t:'Le PER fait baisser votre impôt',b:'Votre taux marginal est de '+Math.round(tmi*100)+' %. Chaque euro versé sur un PER réduit votre revenu imposable : '+eur(ex)+' versés économisent environ '+eur(perSaving(R,p,ex))+' d’impôt. Plafond de déduction estimé : '+eur(cap)+'. Attention : l’argent est bloqué jusqu’à la retraite, sauf cas particuliers.',tag:'Levier fort'});}
  else if(R>0)out.push({t:'Le PER est peu rentable à votre niveau d’impôt',b:'Votre taux marginal est de '+Math.round(tmi*100)+' %. Une déduction économise peu d’impôt tandis que l’argent reste bloqué. Le PEA ou le Livret A sont souvent plus adaptés.',tag:'À savoir'});
  if(!by('pea')&&months>=3)out.push({t:'Pas encore de PEA',b:'Après 5 ans de détention, les gains du PEA sont exonérés d’impôt sur le revenu (les prélèvements sociaux restent dus). Il se prête bien à un versement mensuel dans un fonds indiciel à frais bas.',tag:'Long terme'});
  if(S.kids6>0)out.push({t:'Garde d’enfant de moins de 6 ans',b:'Les frais de garde hors domicile ouvrent droit à un crédit d’impôt de 50 % jusqu’à 3 500 € de dépenses par enfant, soit jusqu’à 1 750 €. Vérifiez que vous les déclarez.',tag:'Crédit d’impôt'});
  out.push({t:'Dons et services à domicile',b:'Les dons à des associations d’aide aux personnes en difficulté donnent 75 % de réduction jusqu’à 2 000 € (66 % au-delà), et l’emploi d’un salarié à domicile 50 % de crédit d’impôt jusqu’à 12 000 € de dépenses. Estimez-les avec les curseurs ci-dessous.',tag:'Réduction d’impôt'});
  return out;
}

  S.levers={per:per,dons:dons,dom:dom,garde:garde};save();

function updateSim(){
  var P=+$('#sim-p').value,Y=+$('#sim-y').value,R=+$('#sim-r').value;
  $('#o-p').textContent=eur(P);$('#o-y').textContent=Y+' an'+(Y>1?'s':'');$('#o-r').textContent=R.toLocaleString('fr-FR')+' %';
  var pts=[];for(var y=0;y<=Y;y++)pts.push({y:y,dep:P*12*y,inv:fv(P,R,12*y)});
  var W=400,H=240,L=48,Rr=14,T=14,B=28,max=niceMax(pts[Y].inv||1);
  var X=function(y){return L+(W-L-Rr)*y/Y;},Yv=function(v){return T+(H-T-B)*(1-v/max);};
  var g='';for(var i=0;i<=4;i++){var v=max*i/4,yy=Yv(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+yy+'" y2="'+yy+'"/><text class="tick" x="'+(L-6)+'" y="'+(yy+4)+'" text-anchor="end">'+compact(v)+'</text>';}
  var xt=Y>=2?[0,Math.round(Y/2),Y]:[0,Y];xt.forEach(function(y,k){g+='<text class="tick" x="'+X(y)+'" y="'+(H-8)+'" text-anchor="'+(k===0?'start':k===xt.length-1?'end':'middle')+'">'+(y===0?'0':y+' an'+(y>1?'s':''))+'</text>';});
  var line=function(k){return pts.map(function(p,i){return (i?'L':'M')+X(p.y).toFixed(1)+' '+Yv(p[k]).toFixed(1);}).join(' ');};

   '<path class="inv-area" d="'+line('inv')+' L'+X(Y)+' '+Yv(0)+' L'+X(0)+' '+Yv(0)+' Z"/><path class="dep" d="'+line('dep')+'"/><path class="inv" d="'+line('inv')+'"/>'+
   '<circle class="dot-dep" cx="'+X(Y)+'" cy="'+Yv(last.dep)+'" r="4.5"/><circle class="dot-inv" cx="'+X(Y)+'" cy="'+Yv(last.inv)+'" r="4.5"/>'+
   '<line class="cross" id="cross" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" style="display:none"/><circle class="dot-inv" id="cx-i" r="4.5" style="display:none" cx="0" cy="0"/><circle class="dot-dep" id="cx-d" r="4.5" style="display:none" cx="0" cy="0"/>'+
   '<rect id="hit" x="'+L+'" y="'+T+'" width="'+(W-L-Rr)+'" height="'+(H-T-B)+'" fill="transparent"/></svg>';

   '<p class="small muted">Hypothèse de rendement moyen, jamais garantie : les marchés montent et descendent selon les années.</p>';
  var hit=$('#hit'),svgEl=$('#simOut svg.chart');

    var p=pts[y],x=X(y);
    $('#cross').setAttribute('x1',x);$('#cross').setAttribute('x2',x);$('#cross').style.display='';
    var ci=$('#cx-i'),cd=$('#cx-d');ci.setAttribute('cx',x);ci.setAttribute('cy',Yv(p.inv));ci.style.display='';cd.setAttribute('cx',x);cd.setAttribute('cy',Yv(p.dep));cd.style.display='';

    var left=x/W*r.width,half=tip.offsetWidth/2;tip.style.left=Math.max(half,Math.min(r.width-half,left))+'px';
  }
  function lv(){['#cross','#cx-i','#cx-d','#tip'].forEach(function(s){var e=$(s);if(e)e.style.display='none';});}

function viewSettings(){
  var h='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>Réglages</h2><button class="btn small" data-tab="month">Terminé</button></div>';
  h+='<div class="card"><h2>Mes chiffres</h2><label class="f">Revenu mensuel net du foyer (€)<input type="number" inputmode="decimal" min="0" data-set="income" data-t="n" value="'+S.income+'"></label><label class="f">Charges fixes mensuelles : loyer ou crédit, assurances, abonnements, énergie (€)<input type="number" inputmode="decimal" min="0" data-set="fixed" data-t="n" value="'+S.fixed+'"></label><label class="f">Épargne à mettre de côté chaque mois (€)<input type="number" inputmode="decimal" min="0" data-set="save" data-t="n" value="'+S.save+'"></label><p class="small muted">Les frais annuels (taxe foncière, assurances annuelles, vacances) se gèrent dans l’onglet Année.</p></div>';
  h+='<div class="card"><h2>Mon profil</h2><p class="small muted">Il adapte les frais annuels proposés et les estimations d’impôt.</p><div class="row"><label class="f">Situation<select data-set="situation" data-t="s"><option value="seul"'+(S.situation==='seul'?' selected':'')+'>Seul(e)</option><option value="couple"'+(S.situation==='couple'?' selected':'')+'>En couple (déclaration commune)</option></select></label><label class="f">Enfants à charge<input type="number" min="0" max="8" data-set="kids" data-t="n" value="'+S.kids+'"></label><label class="f">dont de moins de 6 ans<input type="number" min="0" max="8" data-set="kids6" data-t="n" value="'+S.kids6+'"></label></div>'+
   '<label class="chk"><input type="checkbox" data-set="owner" data-t="b"'+(S.owner?' checked':'')+'> Je suis propriétaire</label><label class="chk"><input type="checkbox" data-set="car" data-t="b"'+(S.car?' checked':'')+'> J’ai un véhicule</label>'+
   '<label class="f">Revenu net imposable annuel du foyer (€), laissez 0 pour l’estimer<input type="number" min="0" inputmode="decimal" data-set="taxIncome" data-t="n" value="'+S.taxIncome+'"></label><p class="small muted">Vous le trouvez sur votre avis d’imposition, à la ligne « revenu fiscal de référence » ou « revenu net imposable ».</p></div>';
  h+='<div class="card"><h2>Mes catégories de dépenses</h2><p class="small muted">Chaque catégorie a sa couleur. Les mots-clés (séparés par des virgules) servent à classer automatiquement les opérations de votre relevé. '+S.cats.length+' sur 8.</p>'+
   S.cats.map(function(c){return '<div class="brow" style="grid-template-columns:auto 1fr auto"><span class="dot" style="background:var(--c'+c.slot+')"></span><b>'+esc(c.name)+'</b>'+(c.name==='Autres'?'<span class="small muted">Par défaut</span>':'<button class="btn small" data-action="cat-del" data-name="'+esc(c.name)+'">Supprimer</button>')+(c.name==='Autres'?'':'<input type="text" style="grid-column:1/-1;text-align:left;width:100%" data-catkw="'+esc(c.name)+'" value="'+esc(c.kw.join(', '))+'" placeholder="mots-clés, séparés par des virgules" aria-label="Mots-clés de '+esc(c.name)+'">')+'</div>';}).join('')+
   (S.cats.length<8?'<form id="catform" class="row" autocomplete="off"><label class="f">Nouvelle catégorie<input id="cf-name" type="text" maxlength="24" placeholder="Animaux" required></label><label class="f">Mots-clés<input id="cf-kw" type="text" placeholder="veterinaire, croquettes"></label><button class="btn primary" type="submit">Ajouter</button></form>':'<p class="small muted">Maximum atteint : supprimez-en une pour en créer une autre.</p>')+'</div>';
  h+='<div class="card"><h2>Mes données</h2><p class="small muted">Tout reste dans ce navigateur, sur cet appareil. Rien n’est envoyé nulle part.</p><div>'+(confirmId==='wipe'?'<button class="btn danger small" data-action="wipe-yes">Confirmer l’effacement</button> <button class="btn small" data-action="wipe-no">Annuler</button>':'<button class="btn small" data-action="wipe">Effacer toutes mes données</button>')+'</div></div>';
  return h;
}

/* ---------- Render ---------- */
var TABS=[['month','Mois','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['spend','Dépenses','<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'],['year','Année','<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>'],['save','Épargne','<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>'],['optim','Optimiser','<path d="M4 19l5-6 4 3 7-9"/><path d="M15 7h5v5"/>']];
function render(){
  $('#dateLabel').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  $('#tabs').innerHTML=TABS.map(function(t){return '<button data-tab="'+t[0]+'"'+(tab===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" aria-hidden="true">'+t[2]+'</svg>'+t[1]+'</button>';}).join('');
  $('#view').innerHTML=({month:viewMonth,spend:viewSpend,year:viewYear,save:viewSave,optim:viewOptim,settings:viewSettings})[tab]();
  if(tab==='optim'&&opt==='learn'){['sim-p','sim-y','sim-r'].forEach(function(id){$('#'+id).addEventListener('input',updateSim);});updateSim();}
  if(tab==='optim'&&opt==='tax'){['lv-per','lv-dons','lv-dom','lv-garde'].forEach(function(id){var e=$('#'+id);if(e)e.addEventListener('input',updateTax);});updateTax();}
  if(tab==='year'&&CUR_YEAR_DATA&&$('#stk')){
    var arr=CUR_YEAR_DATA;
    attachTip('#stk',12,400,44,8,function(i){var m=arr[i],items=S.cats.filter(function(c){return (m.byCat[c.name]||0)>0;}).map(function(c){return [c.name,eur(m.byCat[c.name]),'var(--c'+c.slot+')'];});return tipHTML(MONTHS[i]+' '+yr,items.length?items.concat([['Total variable',eur(m.varT),'transparent']]):[['Aucune opération','','transparent']]);});
  }
  if(tab==='year'&&CUR_SAV&&$('#sav')){
    var sv=CUR_SAV;attachTip('#sav',12,400,44,8,function(i){return '<b>'+MONTHS[i]+'</b><br>'+(sv[i]==null?'Pas de données':'Économie : '+eur(sv[i]));});
  }
  bindDrop();
}
function go(t){tab=t;confirmId=null;window.scrollTo(0,0);render();}

/* ---------- Import ---------- */
function decode(buf){var b=new Uint8Array(buf);try{return new TextDecoder('utf-8',{fatal:true}).decode(b);}catch(e){return new TextDecoder('windows-1252').decode(b);}}
function handleFile(file){
  if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var text=decode(rd.result),list;
    try{list=/<OFX|<STMTTRN/i.test(text)?parseOFX(text):parseCSV(text);}catch(e){list=[];}
    if(!list.length){importMsg='Aucune opération reconnue. Le fichier doit contenir une colonne date, un libellé et un montant (ou débit et crédit).';render();return;}
    var seen={},add=0,skip=0,cnt={},c2={},keep=S.tx.filter(function(t){return !t.ex;}),latest='';
    keep.forEach(function(t){var k=t.date+'|'+t.label+'|'+t.amount;cnt[k]=(cnt[k]||0)+1;seen[k+'|'+cnt[k]]=1;});
    list.forEach(function(o){var k=o.date+'|'+o.label+'|'+o.amount;c2[k]=(c2[k]||0)+1;if(seen[k+'|'+c2[k]]){skip++;return;}
      keep.push({id:uid(),date:o.date,label:o.label,amount:o.amount,cat:categorize(o.label,o.amount,ctx())});add++;if(o.date>latest)latest=o.date;});
    var hadEx=S.example;S.tx=keep;S.example=false;
    if(hadEx){S.annual=S.annual.filter(function(a){return !a.ex;});S.accounts=S.accounts.filter(function(a){return !a.ex;});S.goals=S.goals.filter(function(g){return !g.ex;});}
    if(latest){var cur=mkey(new Date());vm=keep.some(function(t){return t.date.indexOf(cur)===0;})?cur:latest.slice(0,7);yr=+latest.slice(0,4);}
    shown=25;save();
    importMsg=add+' opération'+(add>1?'s':'')+' importée'+(add>1?'s':'')+(skip?' ('+skip+' déjà présente'+(skip>1?'s':'')+')':'')+'. Les dépenses sont classées automatiquement : corrigez celles qui sont fausses.';
    render();
  };
  rd.readAsArrayBuffer(file);
}
function bindDrop(){
  var d=$('#drop');if(!d)return;
  ['dragenter','dragover'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.add('over');});});
  ['dragleave','drop'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault();d.classList.remove('over');});});
  d.addEventListener('drop',function(ev){handleFile(ev.dataTransfer&&ev.dataTransfer.files[0]);});
}

/* ---------- Events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-tab],[data-action]');if(!b)return;
  if(b.dataset.tab){go(b.dataset.tab);return;}
  var a=b.dataset.action,id=b.dataset.id;
  if(a==='qa-cat'){qaCat=b.dataset.cat;$$('[data-action="qa-cat"]').forEach(function(x){x.setAttribute('aria-pressed',String(x.dataset.cat===qaCat));});}
  else if(a==='opt'){opt=b.dataset.v;render();}
  else if(a==='clear-examples'){S.tx=S.tx.filter(function(t){return !t.ex;});S.goals=S.goals.filter(function(g){return !g.ex;});S.annual=S.annual.filter(function(x){return !x.ex;});S.accounts=S.accounts.filter(function(x){return !x.ex;});S.example=false;save();render();toast('Exemples effacés.');}
  else if(a==='wipe'){confirmId='wipe';render();}
  else if(a==='wipe-no'){confirmId=null;render();}
  else if(a==='wipe-yes'){S=blank();confirmId=null;importMsg='';save();render();toast('Toutes vos données ont été effacées.');}
  else if(a==='m-prev'||a==='m-next'){var p=vm.split('-'),d=new Date(+p[0],+p[1]-1+(a==='m-next'?1:-1),1);vm=mkey(d);shown=25;render();}
  else if(a==='y-prev'||a==='y-next'){yr+=a==='y-next'?1:-1;render();}
  else if(a==='more'){shown+=25;render();}
  else if(a==='goal-add'){var inp=$('#g-'+id),v=parseAmt(inp.value),g=S.goals.find(function(x){return x.id===id;});if(g&&v>0){g.saved+=v;g.ex=false;save();render();toast(eur(v)+' ajoutés à « '+g.name+' ».');}else toast('Saisissez un montant.');}
  else if(a==='goal-del'){confirmId=id;render();}
  else if(a==='goal-del-yes'){S.goals=S.goals.filter(function(g){return g.id!==id;});confirmId=null;save();render();}
  else if(a==='goal-boost'){var g2=S.goals.find(function(x){return x.id===id;});if(g2){g2.saved+=+b.dataset.val;g2.ex=false;save();render();toast(eur(+b.dataset.val)+' ajoutés à « '+g2.name+' ».');}}
  else if(a==='set-budget'){S.budgets[b.dataset.cat]=+b.dataset.val;save();render();toast('Plafond fixé pour '+b.dataset.cat+'.');}
  else if(a==='a-del'){S.annual=S.annual.filter(function(x){return x.id!==id;});save();render();}
  else if(a==='a-sug'){var s=SUG.find(function(x){return x.name===b.dataset.n;});if(s){S.annual.push({id:uid(),name:s.name,amount:s.amount,month:s.month,on:true});save();render();toast('Ajouté. Ajustez le montant si besoin.');}}
  else if(a==='acc-del'){S.accounts=S.accounts.filter(function(x){return x.id!==id;});save();render();}
  else if(a==='cat-del'){var nm=b.dataset.name;S.cats=S.cats.filter(function(c){return c.name!==nm;});S.tx.forEach(function(t){if(t.cat===nm)t.cat='Autres';});delete S.budgets[nm];Object.keys(S.rules).forEach(function(k){if(S.rules[k]===nm)delete S.rules[k];});if(qaCat===nm)qaCat='Autres';reclass();save();render();toast('Catégorie supprimée, ses opérations passent en « Autres ».');}
  else if(a==='quiz'){qAns=b.dataset.v==='1';if(qAns===QUIZ[qi][1])qScore++;$('#quiz').innerHTML=quizHTML();}
  else if(a==='quiz-next'){qi++;qAns=null;if(qi>=QUIZ.length&&qScore>(S.best||0)){S.best=qScore;save();}$('#quiz').innerHTML=quizHTML();}
  else if(a==='quiz-again'){qi=0;qScore=0;qAns=null;$('#quiz').innerHTML=quizHTML();}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='qa'){
    var v=parseAmt($('#qa-amt').value);if(!(v>0)){toast('Saisissez un montant.');return;}
    var hadEx=S.example;S.tx=S.tx.filter(function(t){return !t.ex;});S.example=false;
    if(hadEx){S.annual=S.annual.filter(function(a){return !a.ex;});S.accounts=S.accounts.filter(function(a){return !a.ex;});S.goals=S.goals.filter(function(g){return !g.ex;});}
    S.tx.push({id:uid(),date:isoOf(new Date()),label:$('#qa-lbl').value.trim()||qaCat,amount:-Math.round(v*100)/100,cat:qaCat,man:true});
    save();render();toast(eur(v,2)+' ajoutés. Il vous reste '+eur(Math.round(calc().remaining))+' ce mois-ci.');
  }else if(id==='goalform'){
    var t=parseAmt($('#gf-target').value),m=parseAmt($('#gf-monthly').value)||0,n=$('#gf-name').value.trim();
    if(!n||!(t>0))return;S.goals.push({id:uid(),name:n,target:t,saved:0,monthly:m});save();render();toast('Objectif créé.');
  }else if(id==='aform'){
    var am=parseAmt($('#af-amt').value),nm=$('#af-name').value.trim();if(!nm||!(am>0))return;
    S.annual.push({id:uid(),name:nm,amount:am,month:+$('#af-mon').value,on:true});save();render();toast('Frais annuel ajouté.');
  }else if(id==='accform'){
    var aa=parseAmt($('#ac-amt').value),an=$('#ac-name').value.trim();if(!an||aa==null)return;
    S.accounts.push({id:uid(),name:an,type:$('#ac-type').value,amount:aa});save();render();toast('Compte ajouté.');
  }else if(id==='catform'){
    var cn=$('#cf-name').value.trim();if(!cn)return;
    if(S.cats.some(function(c){return norm(c.name)===norm(cn);})||FIXED_NAMES.indexOf(cn)>-1){toast('Cette catégorie existe déjà.');return;}
    var used=S.cats.map(function(c){return c.slot;}),slot=[1,2,3,4,5,6,7,8].find(function(s){return used.indexOf(s)<0;});
    if(!slot)return;
    var kw=$('#cf-kw').value.split(',').map(norm).filter(Boolean),nc={name:cn,slot:slot,kw:kw,custom:true},ai=S.cats.findIndex(function(c){return c.name==='Autres';});
    S.cats.splice(ai<0?S.cats.length:ai,0,nc);reclass();save();render();toast('Catégorie « '+cn+' » créée.');
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='file'){handleFile(el.files[0]);return;}
  if(el.dataset.set){
    var k=el.dataset.set,t=el.dataset.t;
    if(t==='n')S[k]=Math.max(0,parseAmt(el.value)||0);else if(t==='b')S[k]=el.checked;else S[k]=el.value;
    if(S.kids6>S.kids&&(k==='kids'||k==='kids6'))S.kids6=S.kids;
    save();if(k==='kids'||k==='kids6')render();return;
  }
  if(el.dataset.catkw){var c=S.cats.find(function(x){return x.name===el.dataset.catkw;});if(c){c.kw=el.value.split(',').map(norm).filter(Boolean);c.custom=true;reclass();save();toast('Mots-clés enregistrés, opérations reclassées.');}return;}
  if(el.dataset.budget){var v=parseAmt(el.value);if(v>0)S.budgets[el.dataset.budget]=v;else delete S.budgets[el.dataset.budget];save();render();return;}
  if(el.dataset.aon){var a1=S.annual.find(function(x){return x.id===el.dataset.aon;});if(a1){a1.on=el.checked;save();render();}return;}
  if(el.dataset.aamt){var a2=S.annual.find(function(x){return x.id===el.dataset.aamt;});if(a2){a2.amount=Math.max(0,parseAmt(el.value)||0);a2.ex=false;save();render();}return;}
  if(el.dataset.amon){var a3=S.annual.find(function(x){return x.id===el.dataset.amon;});if(a3){a3.month=+el.value;save();render();}return;}
  if(el.dataset.acc){var ac=S.accounts.find(function(x){return x.id===el.dataset.acc;});if(ac){ac.amount=Math.max(0,parseAmt(el.value)||0);ac.ex=false;save();render();}return;}
  if(el.dataset.tx){
    var t2=S.tx.find(function(x){return x.id===el.dataset.tx;});if(!t2)return;
    var key=labelKey(t2.label),n=0;t2.cat=el.value;t2.man=true;t2.ex=false;
    if(key){S.rules[key]=el.value;S.tx.forEach(function(o){if(o!==t2&&o.amount<0&&labelKey(o.label)===key&&o.cat!==el.value){o.cat=el.value;o.man=true;n++;}});}
    save();render();toast(n?'Compris. '+n+' autre'+(n>1?'s':'')+' opération'+(n>1?'s':'')+' reclassée'+(n>1?'s':'')+'.':'Catégorie mise à jour.');return;
  }
  if(el.dataset.step!==undefined){S.steps[+el.dataset.step]=el.checked;save();var y=$('#sim-p')?{p:$('#sim-p').value,y:$('#sim-y').value,r:$('#sim-r').value}:null;var open=$$('details.step').map(function(d){return d.open;});render();$$('details.step').forEach(function(d,i){d.open=open[i];});if(y){$('#sim-p').value=y.p;$('#sim-y').value=y.y;$('#sim-r').value=y.r;updateSim();}}
});
render();
})();
</script>
