<style>

  var T=[[3,'CARREFOUR MARKET',62,'Courses','Supermarché'],[9,'LECLERC DRIVE',84,'Courses','Supermarché'],[16,'LIDL',41,'Courses','Supermarché'],[24,'CARREFOUR CITY',37,'Courses','Supermarché'],[5,'BOULANGERIE PAUL',7,'Restaurants','Boulangerie'],[12,'UBER EATS',26,'Restaurants','Livraison'],[20,'RESTAURANT LE BISTROT',48,'Restaurants','Restaurant'],[4,'SNCF',22,'Transport','Train'],[14,'TOTAL STATION',54,'Transport','Essence'],[18,'CINEMA UGC',19,'Loisirs','Cinéma'],[11,'AMAZON',38,'Shopping','Divers'],[22,'PHARMACIE DU CENTRE',14,'Santé','Pharmacie'],[8,'ZOOPLUS',29,'Animaux','Chat'],[13,'NETFLIX',13.49,'Charges fixes','Abonnements',1]];
  for(var yo=-1;yo<=0;yo++){
    var y=Y+yo;
    for(var m=1;m<=12;m++){
      if(yo===0&&m>now.getMonth()+1)break;
      T.forEach(function(t,i){
        if(yo===0&&m===now.getMonth()+1&&t[0]>=now.getDate())return;
        var wob=1+0.35*Math.sin(m*1.7+i*2.3)+(yo===0&&t[3]==='Restaurants'?0.25:0)+(m===12&&t[3]==='Shopping'?1.2:0)+(m===8&&t[3]==='Loisirs'?1.5:0);
        var amt=t[5]?t[2]:Math.round(t[2]*Math.max(0.4,wob)*100)/100;
        out.push({id:uid(),date:y+'-'+pad(m)+'-'+pad(t[0]),label:t[1],amount:-amt,cat:t[3],sub:t[4],ex:true});
      });
    }
  }
  out.push({id:uid(),date:(Y-1)+'-10-15',label:'DGFIP TAXE FONCIERE',amount:-1100,cat:'Impôts et taxes',sub:'Taxe foncière',ex:true});
  return out;
}

function normalizeState(o){

  if(o.situation==='couple'||o.situation==='seul')d.situation=o.situation;
  ['owner','car','example'].forEach(function(k){if(typeof o[k]==='boolean')d[k]=o[k];});
  if(Array.isArray(o.cats)&&o.cats.length){
    d.cats=o.cats.filter(function(c){return c&&typeof c.name==='string'&&c.name;}).map(function(c){return {name:c.name,slot:(c.slot>=0&&c.slot<=8)?+c.slot:0,role:ROLES[c.role]?c.role:'var',kw:Array.isArray(c.kw)?c.kw.map(String):[],custom:!!c.custom};});

  if(Array.isArray(o.tx))d.tx=o.tx.filter(function(t){return t&&typeof t.date==='string'&&typeof t.amount==='number'&&typeof t.cat==='string';}).map(function(t){return {id:t.id||uid(),date:t.date,label:String(t.label==null?'':t.label),amount:t.amount,cat:t.cat,sub:String(t.sub||''),ex:!!t.ex,man:!!t.man,raw:t.raw?String(t.raw):'',bk:t.bk?String(t.bk):''};});
  if(Array.isArray(o.merch)){d.merch=o.merch.filter(function(m){return m&&typeof m.match==='string'&&m.match&&typeof m.cat==='string';}).map(function(m){return {id:m.id||mid(),match:m.match,name:String(m.name||''),cat:m.cat,sub:String(m.sub||''),auto:m.auto?1:0};});}
  else if(o.rules&&typeof o.rules==='object'){Object.keys(o.rules).forEach(function(k){var r=o.rules[k],c=typeof r==='string'?r:(r&&r.c);if(c)d.merch.push({id:mid(),match:k,name:'',cat:c,sub:(r&&r.s)||'',auto:1});});}

  d.accounts=d.accounts.filter(function(a){return a&&typeof a==='object';}).map(normAcc);

  if(Array.isArray(o.steps)&&o.steps.length===4)d.steps=o.steps.map(Boolean);
  if(o.needsCalib)d.needsCalib=true;
  return d;
}

/* ---------- Calculations ---------- */
function provision(){return sum(S.annual.filter(function(a){return a.on;}).map(function(a){return a.amount;}))/12;}
function avail(){return S.income-S.fixed-provision()-S.save;}
function agg(o,roles,by){var r={},k,p,kk;for(k in o.it){p=k.split(SEP);if(roles.indexOf(p[0])<0)continue;kk=by==='cat'?p[1]:p[1]+SEP+p[2];r[kk]=(r[kk]||0)+o.it[k];}return r;}
function monthData(key){
  var o={it:{},varT:0,fix:0,tax:0,sav:0,one:0,inc:0,extra:0,n:0},list=tbm()[key]||[];
  list.forEach(function(t){
    o.n++;var ro=roleOf(t),k=ro+SEP+t.cat+SEP+(t.sub||'');
    if(isIn(ro)){o.it[k]=(o.it[k]||0)+t.amount;if(ro==='income')o.inc+=t.amount;else o.extra+=t.amount;return;}
    var c=-t.amount;o.it[k]=(o.it[k]||0)+c;
    if(ro==='var')o.varT+=c;else if(ro==='fixed')o.fix+=c;else if(ro==='tax')o.tax+=c;else if(ro==='save')o.sav+=c;else if(ro==='oneoff')o.one+=c;
  });
  o.byCat=agg(o,['var'],'cat');
  return o;
}
function calcM(key){
  var n=new Date(),ck=mkey(n),md=monthData(key),a=avail(),p=key.split('-'),dim=new Date(+p[0],+p[1],0).getDate();
  var el=key<ck?1:(key===ck?n.getDate()/dim:0);
  return {md:md,avail:a,dim:dim,el:el,remaining:a-md.varT,key:key,isCur:key===ck,past:key<ck,endName:dim+' '+MONTHS[+p[1]-1],day:key===ck?n.getDate():dim};
}
function upcoming(maxM){
  var cm=new Date().getMonth()+1;
  return S.annual.filter(function(a){return a.on;}).map(function(a){return {a:a,in:(a.month-cm+12)%12};}).filter(function(x){return x.in<=maxM;}).sort(function(x,y){return x.in-y.in;});
}
function netTax(){return S.taxIncome>0?S.taxIncome:S.income*12;}

function monthSaving(key,m){
  if(!m.n)return null;
  var ck=mkey(new Date()),v=m.varT;
  if(key===ck){var p=key.split('-'),dim=new Date(+p[0],+p[1],0).getDate();v=m.varT/new Date().getDate()*dim;}
  return S.income-S.fixed-provision()-v;
}
function calibrate(){
  var full=fullMonths();if(!full.length)return null;
  var recent=full.slice(-6),inc=0,fix=0,sv=0,i;
  recent.forEach(function(k){var md=monthData(k);inc+=md.inc;fix+=md.fix;});
  full.forEach(function(k){sv+=monthData(k).sav;});
  var r={months:recent.length};
  if(inc>0)S.income=round10(inc/recent.length);
  S.fixed=round10(fix/recent.length);
  S.save=round10(sv/full.length);
  r.income=S.income;r.fixed=S.fixed;r.save=S.save;delete S.needsCalib;save();return r;
}
function monthlyOut(){
  var rec=fullMonths().slice(-6),avgVar=rec.length?sum(rec.map(function(k){return monthData(k).varT;}))/rec.length:Math.max(0,S.income-S.fixed-S.save-provision());
  return Math.max(1,S.fixed+provision()+avgVar);
}

function accNotes(a){
  var y=new Date().getFullYear(),n=[];

  if(a.type==='pea'){if(a.since)n.push(y-a.since<5?'Cinq ans en '+(a.since+5)+' : un retrait avant ferme le plan et fait perdre l’avantage fiscal.':'Plus de 5 ans : les gains sont exonérés d’impôt sur le revenu (prélèvements sociaux dus).');else n.push('Indiquez l’année d’ouverture pour suivre les 5 ans.');}

  if(a.type==='lep')n.push('Réservé aux foyers sous un plafond de revenus. Taux généralement supérieur au Livret A.');

function accAdvice(){
  var out=[],spend=monthlyOut(),A=accBy('livretA'),L=accBy('ldds'),cour=accBy('courant'),y=new Date().getFullYear();
  if(!S.accounts.length)return [{t:'Commencez par lister vos comptes',b:'Ajoutez votre compte courant, vos livrets, votre assurance-vie ou votre PEA, même dans une autre banque. Les pistes deviennent personnalisées dès le premier compte.',tag:'À faire'}];
  var idle=cour-spend*1.5;
  if(idle>=300)out.push({t:eur(Math.round(idle/10)*10)+' dorment sur le compte courant',b:'Un compte courant ne rapporte rien. Au-delà d’environ un mois et demi de dépenses, déplacez le surplus vers un livret : Livret A (place restante '+eur(Math.max(0,ACC.livretA.cap-A))+') ou LDDS (place restante '+eur(Math.max(0,ACC.ldds.cap-L))+'). Les intérêts sont exonérés d’impôt.',tag:'Gain sans risque'});
  if(A>=ACC.livretA.cap*0.95)out.push({t:'Votre Livret A est presque plein',b:'Les nouveaux versements peuvent aller sur un LDDS (plafond 12 000 €)'+(accBy('lep')?'':' ou un LEP si vous y avez droit')+', avec la même exonération d’impôt.',tag:'Plafond'});
  else if(A>0&&!S.accounts.some(function(a){return a.type==='ldds';}))out.push({t:'Pas encore de LDDS',b:'Le LDDS complète le Livret A : mêmes avantages (sans impôt, disponible), plafond de 12 000 €. Utile pour répartir et pour garder de la place sur le Livret A.',tag:'À envisager'});
  if(!S.accounts.some(function(a){return a.type==='lep';}))out.push({t:'Avez-vous droit au LEP ?',b:'Le Livret d’épargne populaire (plafond 10 000 €) rapporte en général davantage que le Livret A, sans impôt. Il est réservé aux foyers sous un plafond de revenus : renseignez-vous auprès de votre banque ou sur service-public.fr.',tag:'À vérifier'});
  var cand=S.accounts.filter(function(a){return ACC[a.type].liquid&&a.type!=='courant'&&a.rate!=null;}),hi=null,lo=null;
  cand.forEach(function(a){if(a.type!=='lj'&&a.type!=='lep'&&(!hi||a.rate>hi.rate))hi=a;if(a.amount>=500&&(!lo||a.rate<lo.rate))lo=a;});
  if(hi&&lo&&hi!==lo&&hi.rate-lo.rate>=0.5){
    var room=ACC[hi.type].cap?Math.max(0,ACC[hi.type].cap-hi.amount):lo.amount,mv=Math.min(lo.amount,room);
    if(mv>=200)out.push({t:'« '+lo.name+' » rapporte moins que « '+hi.name+' »',b:lo.rate.toLocaleString('fr-FR')+' % contre '+hi.rate.toLocaleString('fr-FR')+' %. Déplacer '+eur(Math.round(mv/10)*10)+' vers « '+hi.name+' » rapporterait environ '+eur(mv*(hi.rate-lo.rate)/100)+' de plus par an. Vérifiez que les deux sont disponibles et que les conditions vous conviennent.',tag:'Gain sans risque'});
  }
  S.accounts.forEach(function(a){
    if(a.type==='av'&&a.since&&y-a.since<8)out.push({t:'Assurance-vie « '+a.name+' » : patience jusqu’en '+(a.since+8),b:'Après 8 ans, les gains retirés bénéficient d’un abattement annuel. Éviter de la clôturer avant cette date.',tag:'À garder'});
    if(a.type==='pea'&&a.since&&y-a.since<5)out.push({t:'PEA « '+a.name+' » : cinq ans en '+(a.since+5),b:'Un retrait avant cette date ferme le plan et fait perdre l’avantage fiscal. Ne le touchez pas si vous pouvez.',tag:'À garder'});
    if(a.type==='pel'&&a.rate==null)out.push({t:'Quel est le taux de votre PEL ?',b:'Le taux d’un PEL est fixé à l’ouverture, selon l’année. Indiquez-le pour le comparer avec vos livrets.',tag:'À compléter'});

  });
  return out.slice(0,6);
}

function upsertMerch(match,name,cat,sub){

  else{m={id:mid(),match:match,name:name,cat:cat,sub:sub,auto:0};S.merch.unshift(m);}

function applyMerch(m){
  var n=0,ws=mwords(m.match);if(!ws.length)return 0;
  S.tx.forEach(function(t){
    if(t.ex)return;
    var h=hay((t.raw||'')+' '+t.label),ok=true,j;
    for(j=0;j<ws.length;j++){if(h.indexOf(m.auto?' '+ws[j]+' ':' '+ws[j])<0){ok=false;break;}}
    if(!ok)return;
    var ro=catRole(m.cat);if(ro&&isIn(ro)!==(t.amount>0))return;
    var ch=t.cat!==m.cat||(m.sub&&(t.sub||'')!==m.sub)||(m.name&&t.label!==m.name);
    if(m.sub)t.sub=m.sub;else if(t.cat!==m.cat)t.sub='';
    t.cat=m.cat;if(m.name)t.label=m.name;t.amount=signFor(S.cats,t.cat,t.amount);

  S.cats.splice(Math.max(0,S.cats.findIndex(function(x){return x.name==='Autres';})),0,c2);_rm=null;return c2;

    if(c3.role!=='var'&&c3.slot&&false)c3.slot=c3.slot;
    S.tx.forEach(function(x){if(x.cat===c3.name)x.amount=signFor(S.cats,x.cat,x.amount);});
    save();render();toast('Type mis à jour.');return;
  }
  if(el.dataset.catslot){var c4=rmap()[el.dataset.catslot];if(!c4)return;c4.slot=+el.value;save();render();return;}
  if(el.dataset.catkw){var c=rmap()[el.dataset.catkw];if(c){c.kw=el.value.split(',').map(norm).filter(Boolean);c.custom=true;reclass();save();toast('Mots-clés enregistrés, opérations reclassées.');}return;}
  if(el.dataset.budget){var v=parseAmt(el.value);if(v>0)S.budgets[el.dataset.budget]=v;else delete S.budgets[el.dataset.budget];save();render();return;}
  if(el.dataset.aon){var a1=S.annual.find(function(x){return x.id===el.dataset.aon;});if(a1){a1.on=el.checked;save();render();}return;}
  if(el.dataset.aamt){var a2=S.annual.find(function(x){return x.id===el.dataset.aamt;});if(a2){a2.amount=Math.max(0,parseAmt(el.value)||0);a2.ex=false;save();render();}return;}
  if(el.dataset.amon){var a3=S.annual.find(function(x){return x.id===el.dataset.amon;});if(a3){a3.month=+el.value;save();render();}return;}
  if(el.dataset.step!==undefined){S.steps[+el.dataset.step]=el.checked;save();var y=$('#sim-p')?{p:$('#sim-p').value,y:$('#sim-y').value,r:$('#sim-r').value}:null;var open=$$('details.step').map(function(d){return d.open;});render();$$('details.step').forEach(function(d,i){d.open=open[i];});if(y){$('#sim-p').value=y.p;$('#sim-y').value=y.y;$('#sim-r').value=y.r;updateSim();}}
});

/* ---------- Verrouillage (code + Face ID), installation, hors ligne ---------- */
var LKEY='comptesurmoi.lock',PIN_LEN=6,locked=false,hiddenAt=0,pinBuf='',lkTimer=null,deferredPrompt=null,swReady=false,LK=loadLock();
function loadLock(){try{var r=localStorage.getItem(LKEY),o=r?JSON.parse(r):null;if(o&&o.salt&&o.hash)return {salt:o.salt,hash:o.hash,iter:o.iter||150000,cred:o.cred||'',delay:typeof o.delay==='number'?o.delay:60,fails:o.fails||0,until:o.until||0};}catch(e){}return null;}
function saveLock(){try{if(LK)localStorage.setItem(LKEY,JSON.stringify(LK));else localStorage.removeItem(LKEY);}catch(e){}}
function b64(buf){var a=new Uint8Array(buf),s='',i;for(i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(t){var b=atob(t),a=new Uint8Array(b.length),i;for(i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function lockAvailable(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues);}
function bioSupported(){return !!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create&&lockAvailable());}
function hashPin(pin,salt,iter){return crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']).then(function(k){return crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:salt,iterations:iter},k,256);}).then(b64);}
function setPin(pin){
  var salt=crypto.getRandomValues(new Uint8Array(16)),iter=150000;
  return hashPin(pin,salt,iter).then(function(h){LK=Object.assign(LK||{cred:'',delay:60,fails:0,until:0},{salt:b64(salt),hash:h,iter:iter,fails:0,until:0});saveLock();});
}
function verifyPin(pin){return hashPin(pin,unb64(LK.salt),LK.iter).then(function(h){return h===LK.hash;});}
function bioEnroll(){
  return navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'Compte sur Moi'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'compte-sur-moi',displayName:'Compte sur Moi'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}}).then(function(c){return b64(c.rawId);});
}
function bioCheck(){
  return navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(LK.cred),transports:['internal']}],userVerification:'required',timeout:60000}});
}
function lockHTML(){
  var keys='',i;
  for(i=1;i<=9;i++)keys+='<button class="key" data-action="k" data-v="'+i+'" aria-label="'+i+'">'+i+'</button>';
  keys+=LK&&LK.cred?'<button class="key alt" data-action="k-bio" aria-label="Déverrouiller avec Face ID ou Touch ID">'+'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M9 9v1.5M15 9v1.5M12 9v4h-1M9 16c1.7 1.4 4.3 1.4 6 0"/></svg></button>':'<span></span>';
  keys+='<button class="key" data-action="k" data-v="0" aria-label="0">0</button><button class="key alt" data-action="k-del" aria-label="Effacer le dernier chiffre">⌫</button>';
  return '<div class="lockbox" role="dialog" aria-modal="true" aria-labelledby="lk-t"><h1 id="lk-t">Compte sur Moi</h1><p id="lk-sub">Entrez votre code à '+PIN_LEN+' chiffres</p><div class="pdots" id="lk-dots" aria-hidden="true"></div><p class="sr" id="lk-live" role="status" aria-live="polite"></p><p class="lkmsg" id="lk-msg" role="alert"></p><div class="pad">'+keys+'</div>'+(LK&&LK.cred?'<button class="btn" data-action="k-bio" style="margin-top:6px">Utiliser Face ID, Touch ID ou Windows Hello</button>':'')+'<button class="linkbtn" data-action="k-forgot">Code oublié ?</button><div id="lk-forgot" hidden class="note"><p>Le code ne peut pas être récupéré : il n’est stocké que sur cet appareil. Vous pouvez effacer les données de cet appareil, puis restaurer votre sauvegarde (fichier .json) dans les Réglages.</p><button class="btn danger" data-action="k-wipe">Effacer les données de cet appareil</button></div></div>';
}
function paintDots(){var d=$('#lk-dots'),h='',i;if(!d)return;for(i=0;i<PIN_LEN;i++)h+='<i class="'+(i<pinBuf.length?'on':'')+'"></i>';d.innerHTML=h;var l=$('#lk-live');if(l)l.textContent=pinBuf.length+' chiffre'+(pinBuf.length>1?'s':'')+' saisi'+(pinBuf.length>1?'s':'');}
function lkMsg(t){var m=$('#lk-msg');if(m)m.textContent=t||'';}
function lockedOut(){var left=Math.ceil((LK.until-Date.now())/1000);return left>0?left:0;}
function tickLock(){
  clearTimeout(lkTimer);var l=LK&&lockedOut();
  if(l){lkMsg('Trop d’essais. Réessayez dans '+l+' s.');lkTimer=setTimeout(tickLock,1000);}else if($('#lk-msg')&&/Trop/.test($('#lk-msg').textContent))lkMsg('');
}
function showLock(){
  if(!LK||locked)return;
  locked=true;pinBuf='';
  var o=document.createElement('div');o.id='lock';o.innerHTML=lockHTML();document.body.appendChild(o);
  $$('.app,nav.tabs').forEach(function(e){e.setAttribute('inert','');e.setAttribute('aria-hidden','true');});
  document.body.classList.add('locked');paintDots();tickLock();
  var f=$('#lock .key');if(f)f.focus();
}
function hideLock(){
  locked=false;pinBuf='';var o=$('#lock');if(o)o.remove();
  $$('.app,nav.tabs').forEach(function(e){e.removeAttribute('inert');e.removeAttribute('aria-hidden');});
  document.body.classList.remove('locked','blurred');
  var v=$('#view');if(v)v.focus({preventScroll:true});
}
function unlockOK(){LK.fails=0;LK.until=0;saveLock();hideLock();}
function pressKey(d){
  if(!locked||lockedOut()||pinBuf.length>=PIN_LEN)return;
  pinBuf+=d;paintDots();lkMsg('');
  if(pinBuf.length===PIN_LEN){
    var p=pinBuf;
    verifyPin(p).then(function(ok){
      if(ok){unlockOK();return;}
      LK.fails++;if(LK.fails>=5){LK.until=Date.now()+30000*Math.pow(2,Math.min(6,LK.fails-5));}saveLock();
      pinBuf='';paintDots();lkMsg(lockedOut()?'':'Code incorrect.');tickLock();
    },function(){pinBuf='';paintDots();lkMsg('Vérification impossible sur cet appareil.');});
  }
}
document.addEventListener('keydown',function(e){
  if(!locked)return;
  if(/^\d$/.test(e.key)&&!e.ctrlKey&&!e.metaKey){pressKey(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){pinBuf=pinBuf.slice(0,-1);paintDots();e.preventDefault();}
});
document.addEventListener('visibilitychange',function(){
  if(!LK)return;
  if(document.visibilityState==='hidden'){hiddenAt=Date.now();document.body.classList.add('blurred');if(LK.delay===0)showLock();}
  else{if(!locked&&Date.now()-hiddenAt>=LK.delay*1000)showLock();if(!locked)document.body.classList.remove('blurred');}
});
function lockCard(){
  var h='<div class="card"><h2>Verrouillage</h2>';
  if(!lockAvailable())return h+'<p class="small muted">Le verrouillage n’est pas disponible dans ce navigateur. Ouvrez l’application depuis Safari ou Chrome, en connexion sécurisée (https).</p></div>';
  h+='<p class="small muted">Un code protège l’accès à l’application sur cet appareil. Il n’y a ni compte ni serveur : le code est vérifié ici, et il ne peut pas être récupéré s’il est perdu (pensez à garder une sauvegarde).</p>';
  if(!LK){
    h+='<form id="lockset" class="stack" autocomplete="off"><div class="row"><label class="f">Code à '+PIN_LEN+' chiffres<input id="lk-new" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="new-password" required></label><label class="f">Confirmer le code<input id="lk-new2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="new-password" required></label></div><button class="btn primary" type="submit" style="align-self:flex-start">Activer le verrouillage</button></form></div>';
    return h;
  }
  h+='<p><b>Verrouillage activé.</b></p>';
  h+='<div class="row"><button class="btn" data-action="lock-now">Verrouiller maintenant</button>'+(LK.cred?'<button class="btn" data-action="bio-off">Désactiver Face ID</button>':(bioSupported()?'<button class="btn" data-action="bio-on">Activer Face ID, Touch ID ou Windows Hello</button>':''))+'</div>';
  if(LK.cred)h+='<p class="small muted">Face ID, Touch ID ou Windows Hello sert de raccourci : il confirme que c’est bien vous qui tenez l’appareil. Le code reste toujours possible.</p>';
  h+='<label class="f">Verrouiller<select id="lk-delay"><option value="0"'+(LK.delay===0?' selected':'')+'>Dès que je quitte l’application</option><option value="60"'+(LK.delay===60?' selected':'')+'>Après 1 minute hors de l’application</option><option value="300"'+(LK.delay===300?' selected':'')+'>Après 5 minutes hors de l’application</option></select></label>';
  h+='<details data-keep="lkchg"><summary class="small">Changer le code</summary><form id="lockchange" class="stack" style="margin-top:10px" autocomplete="off"><label class="f">Code actuel<input id="lk-cur" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="current-password" required></label><div class="row"><label class="f">Nouveau code<input id="lk-new" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="new-password" required></label><label class="f">Confirmer<input id="lk-new2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="new-password" required></label></div><button class="btn" type="submit" style="align-self:flex-start">Changer le code</button></form></details>';
  h+='<details data-keep="lkoff"><summary class="small">Désactiver le verrouillage</summary><form id="lockoff" class="stack" style="margin-top:10px" autocomplete="off"><label class="f">Code actuel<input id="lk-cur2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="'+PIN_LEN+'" autocomplete="current-password" required></label><button class="btn danger" type="submit" style="align-self:flex-start">Désactiver</button></form></details></div>';
  return h;
}
function isStandalone(){return !!(window.navigator.standalone||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches));}

  var h='<div class="card"><h2>Installer l’application</h2>';

  else{
    h+='<p class="small muted">Installez Compte sur Moi pour l’ouvrir comme une application, avec son icône sur l’écran d’accueil.</p>';
    if(deferredPrompt)h+='<button class="btn primary" data-action="install" style="align-self:flex-start">Installer sur cet appareil</button>';
    h+='<details data-keep="inst"><summary class="small">Comment faire</summary><div class="stack" style="margin-top:10px"><p class="small"><b>iPhone ou iPad (Safari) :</b> touchez le bouton Partager (le carré avec une flèche), puis « Sur l’écran d’accueil », puis « Ajouter ».</p><p class="small"><b>Ordinateur (Chrome ou Edge) :</b> cliquez sur l’icône d’installation à droite de la barre d’adresse, ou ouvrez le menu puis « Installer Compte sur Moi ».</p><p class="small"><b>Android (Chrome) :</b> menu à trois points, puis « Installer l’application ».</p></div></details>';
  }
  h+='<p class="small muted">'+(swReady?'Disponible sans connexion internet : après la première ouverture, l’application et vos données fonctionnent hors ligne.':'Le mode hors ligne s’active après la première ouverture avec internet, depuis le lien de l’application.')+'</p></div>';

window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;if(tab==='settings')render();});
window.addEventListener('appinstalled',function(){deferredPrompt=null;if(tab==='settings')render();});
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').then(function(){return navigator.serviceWorker.ready;}).then(function(){swReady=true;if(tab==='settings')render();}).catch(function(){});}}catch(e){}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(simplifyAll())save();
initView();render();
if(LK)showLock();
})();
